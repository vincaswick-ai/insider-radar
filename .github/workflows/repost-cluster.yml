name: Repost cluster

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker, e.g. STC"
        required: true
      target:
        description: "Where to post"
        type: choice
        options: [test, public]
        default: test

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python repost.py
        env:
          TICKER: ${{ inputs.ticker }}
          TARGET: ${{ inputs.target }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          WEBHOOK_PROOF: ${{ secrets.WEBHOOK_PROOF }}
          WEBHOOK_INSIDER_BUYS: ${{ secrets.WEBHOOK_INSIDER_BUYS }}
          WEBHOOK_CLUSTER: ${{ secrets.WEBHOOK_CLUSTER }}
