name: Test clusterport

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          WEBHOOK_PROOF: ${{ secrets.WEBHOOK_PROOF }}
        run: python clusterport.py
      - name: Save results
        if: always()
        run: |
          git config user.name "insider-radar-bot"
          git config user.email "insider-radar-bot@users.noreply.github.com"
          git add clusterport_results.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "clusterport results [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
