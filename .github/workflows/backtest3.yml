name: Backtest round 3

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year (data starts 2006)"
        default: "2006"
      end_year:
        description: "Last year"
        default: "2026"
      bench:
        description: "Benchmark: SPY (S&P 500) or IWM (small companies)"
        default: "SPY"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backtest
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          WEBHOOK_PROOF: ${{ secrets.WEBHOOK_PROOF }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          BENCH: ${{ inputs.bench }}
        run: python backtest3.py
      - name: Save results
        if: always()
        run: |
          git config user.name "insider-radar-bot"
          git config user.email "insider-radar-bot@users.noreply.github.com"
          git add backtest3_results.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Backtest round 3 results [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
