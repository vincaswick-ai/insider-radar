name: Insider alerts

on:
  schedule:
    # every 15 minutes, Monday to Friday (UTC). GitHub may start runs a few minutes late.
    - cron: "*/15 * * * 1-5"
  workflow_dispatch: {}   # lets you start a run by hand from the Actions tab

permissions:
  contents: write         # needed to save state.json back to the repo

concurrency:
  group: insider-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check SEC filings and post alerts
        env:
          WEBHOOK_INSIDER_BUYS: ${{ secrets.WEBHOOK_INSIDER_BUYS }}
          WEBHOOK_CLUSTER: ${{ secrets.WEBHOOK_CLUSTER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MIN_VALUE: ${{ vars.MIN_VALUE || '50000' }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "insider-radar-bot"
            git config user.email "insider-radar-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update state [skip ci]"
            git push
          fi
