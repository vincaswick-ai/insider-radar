name: Politician trades

on:
  schedule:
    # every 2 hours (UTC). Congress filings are published during US office hours.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug: print what would be posted, post nothing"
        type: boolean
        default: false
      test_post:
        description: "Test: post one filing (e.g. H20035563) to #bot-testing"
        default: ""
      scan_days:
        description: "Scan: list committee matches of the last N days (0 = normal run)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: politician-trades
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check Congress filings and post alerts
        env:
          WEBHOOK_POLITICIANS: ${{ secrets.WEBHOOK_POLITICIANS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          POL_DEBUG: ${{ inputs.debug && '1' || '0' }}
          POL_SCAN_DAYS: ${{ inputs.scan_days || '0' }}
          POL_TEST_POST: ${{ inputs.test_post || '' }}
          POL_LOOKBACK_DAYS: ${{ inputs.test_post && '30' || '10' }}
          WEBHOOK_PROOF: ${{ secrets.WEBHOOK_PROOF }}
        run: python politicians.py
      - name: Save state
        if: always() && (inputs.scan_days == '' || inputs.scan_days == '0' || inputs.scan_days == null)
        run: |
          if [ -n "$(git status --porcelain pol_state.json)" ]; then
            git config user.name "insider-radar-bot"
            git config user.email "insider-radar-bot@users.noreply.github.com"
            git add pol_state.json
            git commit -m "Update politician state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
